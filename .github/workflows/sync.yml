name: Sync Plugin Master

on:
  repository_dispatch:
    types: [update-plugin]
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Update pluginmaster.json
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          
          // Get version from dispatch payload or use current
          const version = context.payload.client_payload?.version || '1.15.0.5';
          const timestamp = Math.floor(Date.now() / 1000).toString();
          
          // Read and update pluginmaster.json
          let pluginmaster = JSON.parse(fs.readFileSync('pluginmaster.json', 'utf8'));
          if (pluginmaster.length > 0) {
            pluginmaster[0].AssemblyVersion = version;
            pluginmaster[0].LastUpdate = timestamp;
          }
          
          fs.writeFileSync('pluginmaster.json', JSON.stringify(pluginmaster, null, 4));
          
    - name: Commit changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add pluginmaster.json
        git diff --staged --quiet || git commit -m "Update pluginmaster.json"
        git push
