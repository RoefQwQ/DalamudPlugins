name: Sync Plugin Master

on:
  repository_dispatch:
    types: [update-plugin]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Update pluginmaster.json
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          
          const version = context.payload.client_payload?.version || '1.15.0.5';
          const tag = context.payload.client_payload?.tag || 'v' + version;
          const timestamp = Math.floor(Date.now() / 1000).toString();
          const owner = 'RoefQwQ';
          const repo = 'InventoryTools';
          
          let pluginmaster = JSON.parse(fs.readFileSync('pluginmaster.json', 'utf8'));
          if (pluginmaster.length > 0) {
            pluginmaster[0].AssemblyVersion = version;
            pluginmaster[0].LastUpdate = timestamp;
            pluginmaster[0].DownloadLinkInstall = `https://github.com/${owner}/${repo}/releases/download/${tag}/InventoryTools.zip`;
            pluginmaster[0].DownloadLinkUpdate = `https://github.com/${owner}/${repo}/releases/download/${tag}/InventoryTools.zip`;
          }
          
          fs.writeFileSync('pluginmaster.json', JSON.stringify(pluginmaster, null, 4));
          
    - name: Commit changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add pluginmaster.json
        git diff --staged --quiet || git commit -m "Update pluginmaster.json to version ${{ github.event.client_payload.version || 'manual' }}"
        git push
